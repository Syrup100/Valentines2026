<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Be My Valentine? ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Full screen setup */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Iwas scroll */
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffeef2; display: flex; justify-content: center;
            align-items: center; z-index: 9999; cursor: pointer;
        }

        #yes-screen { display: none; flex-direction: column; align-items: center; justify-content: center; }

        .container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; 
            padding: 10px;
            height: 100vh; /* Sakop ang buong screen height */
            box-sizing: border-box;
        }

        /* Responsive Text */
        h1 { 
            color: white; 
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
            font-size: 1.5rem; /* Pinaliit para sa phone */
            margin: 10px 0;
        }

        .sweet-message {
            color: white; 
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
            font-size: 1.1rem; /* Compact font size */
            font-weight: bold;
            max-width: 90%; 
            line-height: 1.2;
            margin-top: 10px;
        }

        /* Image/GIF Auto-fit */
        #header-img, .yay-gif {
            max-height: 35vh; /* Limit height to 35% of the screen */
            width: auto;
            max-width: 80%;
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .buttons {
            margin-top: 15px; 
            display: flex; 
            gap: 10px; 
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        #yesButton { background: #28a745; color: white; }
        #noButton { background: #dc3545; color: white; }

        /* Para sa napakaliit na screens */
        @media (max-height: 600px) {
            h1 { font-size: 1.2rem; }
            .sweet-message { font-size: 1rem; }
            #header-img, .yay-gif { max-height: 30vh; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startEverything()">
        <button style="padding: 15px 30px; font-size: 1.2rem; background: #ff4d6d; color: white; border-radius: 50px; border: none;">Click to Open ❤️</button>
    </div>

    <audio id="myAudio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="proposal-screen" class="container">
        <img id="header-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpndW10eGZ6bm5oZzR4eG5oZzR4eG5oZzR4eG5oZzR4eG5oZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesButton" onclick="showYesScreen()">YES</button>
            <button id="noButton" onclick="increaseYesSize()">NO</button>
        </div>
    </div>

    <div id="yes-screen" class="container">
        <h1>YAAAAAAAAAAY!!! 🥰</h1>
        <img class="yay-gif" src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2cwdXU1MzZnZXZwY3owcTk2emFycWtwbXYwajFraW9hbG1nbnh1cyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/W3fbjOoLVKHGYHlJ4z/giphy.gif">
        <p class="sweet-message">
            Thank you Baby! I promise that we'll have a wonderful time together. I love you so much! ❤️
        </p>
    </div>

    <script>
        function startEverything() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('myAudio').play();
        }

        function showYesScreen() {
            document.getElementById('proposal-screen').style.display = 'none';
            document.getElementById('yes-screen').style.display = 'flex';
        }

        let yesSize = 1;
        function increaseYesSize() {
            yesSize += 0.3; 
            const yesButton = document.getElementById('yesButton');
            yesButton.style.transform = `scale(${yesSize})`;
            
            const noMessages = ["Mali!", "Luh?", "Grabe!", "Wrong!", "Bawal!"];
            const noButton = document.getElementById('noButton');
            noButton.innerText = noMessages[Math.floor(Math.random() * noMessages.length)];
        }
    </script>
</body>
</html>
