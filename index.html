<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Overlay para sa Music */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffeef2; display: flex; justify-content: center;
            align-items: center; z-index: 9999; cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #yes-screen { display: none; }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* Styling para sa "YAY" Message */
        .sweet-message {
            color: white; /* White font */
            font-size: 1.8rem; /* Bigger font */
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* Para mas madaling basahin sa background */
            margin-top: 20px;
            max-width: 80%;
            line-height: 1.4;
        }

        #header-img {
            max-width: 250px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startEverything()">
        <button style="padding: 20px 40px; font-size: 1.5rem; background: #ff4d6d; color: white; border-radius: 50px; border: none; cursor: pointer;">Click to Open ❤️</button>
    </div>

    <audio id="myAudio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="proposal-screen" class="container">
        <img id="header-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpndW10eGZ6bm5oZzR4eG5oZzR4eG5oZzR4eG5oZzR4eG5oZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button id="yesButton" onclick="showYesScreen()">YES</button>
            <button id="noButton" onclick="increaseYesSize()">NO</button>
        </div>
    </div>

    <div id="yes-screen" class="container">
        <h1 style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">YAY! See you on February 14, 2026! 🥰</h1>
        <img src="https://media.tenor.com/7p6p-mH9F-kAAAAd/nub-nub-cat.gif" alt="Nub Nub Cat" style="width: 280px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
        
        <p class="sweet-message">
            Thank you, Baby! I'm the happiest! I promise that we'll have a wonderful time together. I love you so much! ❤️
        </p>
    </div>

    <script>
        function startEverything() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
            }, 500);
            document.getElementById('myAudio').play();
        }

        function showYesScreen() {
            document.getElementById('proposal-screen').style.display = 'none';
            document.getElementById('yes-screen').style.display = 'flex';
        }

        let yesSize = 1;
        function increaseYesSize() {
            yesSize += 0.4; 
            const yesButton = document.getElementById('yesButton');
            yesButton.style.transform = `scale(${yesSize})`;
            
            const noMessages = ["Mali Babe!", "Luh?", "Anlala Grabe!", "Wrong Answer!", "Bahala Ka Sa Buhay Mo!"];
            const noButton = document.getElementById('noButton');
            noButton.innerText = noMessages[Math.floor(Math.random() * noMessages.length)];
        }
    </script>
</body>
</html>
