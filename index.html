<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? ❤️</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Overlay para sa Music */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffeef2; display: flex; justify-content: center;
            align-items: center; z-index: 9999; cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #yes-screen { display: none; flex-direction: column; align-items: center; justify-content: center; }

        .container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 15px;
            box-sizing: border-box;
            width: 100%;
        }

        /* Responsive Text Styling */
        h1, .sweet-message {
            color: white; 
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9), 0px 0px 20px rgba(0,0,0,0.5);
        }

        h1 { font-size: 2rem; margin-bottom: 15px; } /* Mas maliit nang konti para sa mobile */

        .sweet-message {
            font-size: 1.4rem; /* Adjusted for better phone fit */
            font-weight: bold;
            margin-top: 15px; 
            max-width: 95%; 
            line-height: 1.3;
        }

        /* Image/GIF Responsiveness */
        #header-img, .cat-gif {
            max-width: 250px; /* Smaller default for phones */
            width: 80%; 
            height: auto;
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Specific fix para sa Giphy GIF para hindi lumampas */
        .yay-gif {
            max-width: 220px;
            width: 70%;
            height: auto;
            border-radius: 15px;
        }

        /* Screen optimization for very small phones */
        @media (max-width: 380px) {
            h1 { font-size: 1.6rem; }
            .sweet-message { font-size: 1.2rem; }
            .start-btn { font-size: 1.2rem !important; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startEverything()">
        <button class="start-btn" style="padding: 15px 30px; font-size: 1.4rem; background: #ff4d6d; color: white; border-radius: 50px; border: none; cursor: pointer;">Click to Open ❤️</button>
    </div>

    <audio id="myAudio" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="proposal-screen" class="container">
        <img id="header-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpndW10eGZ6bm5oZzR4eG5oZzR4eG5oZzR4eG5oZzR4eG5oZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons" style="margin-top: 15px; display: flex; gap: 15px; align-items: center;">
            <button id="yesButton" onclick="showYesScreen()" style="padding: 12px 25px; font-size: 1.1rem; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer;">YES</button>
            <button id="noButton" onclick="increaseYesSize()" style="padding: 12px 25px; font-size: 1.1rem; background: #dc3545; color: white; border: none; border-radius: 10px; cursor: pointer;">NO</button>
        </div>
    </div>

    <div id="yes-screen" class="container">
        <h1>YAY! See you on February 14, 2026! 🥰</h1>
        
        <img class="yay-gif" src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2cwdXU1MzZnZXZwY3owcTk2emFycWtwbXYwajFraW9hbG1nbnh1cyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/W3fbjOoLVKHGYHlJ4z/giphy.gif">
        
        <p class="sweet-message">
            Thank you, Baby! I promise that we'll have a wonderful time together. I love you so much! ❤️
        </p>
    </div>

    <script>
        function startEverything() {
            document.getElementById('overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 500);
            let audio = document.getElementById('myAudio');
            audio.play();
        }

        function showYesScreen() {
            document.getElementById('proposal-screen').style.display = 'none';
            document.getElementById('yes-screen').style.display = 'flex';
        }

        let yesSize = 1;
        function increaseYesSize() {
            yesSize += 0.35; // Slightly slower growth for better mobile handling
            const yesButton = document.getElementById('yesButton');
            yesButton.style.transform = `scale(${yesSize})`;
            
            const noMessages = ["Mali Babe!", "Luh?", "Anlala Grabe!", "Wrong Answer!", "Bahala Ka Sa Buhay Mo!"];
            const noButton = document.getElementById('noButton');
            noButton.innerText = noMessages[Math.floor(Math.random() * noMessages.length)];
        }
    </script>
</body>
</html>
